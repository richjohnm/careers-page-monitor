name: Careers Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'  # hourly at :17 UTC

permissions:
  contents: write   # <-- allow push if your scraper commits state

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true   # <-- keeps GITHUB_TOKEN for push

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile scraper/main.py

      # Run the scraper, capture its output, and detect "Found N new jobs."
      - name: Run scraper and capture output
        id: scrape
        shell: bash
        run: |
          set -e
          # Run your scraper and capture stdout so we can parse it
          python -m scraper.main | tee scraper_out.txt

          # Extract the number from a line like: "Found 0 new jobs." or "Found 3 new jobs"
          COUNT=$(grep -Eo 'Found[[:space:]][0-9]+[[:space:]]+new job' scraper_out.txt \
                  | grep -Eo '[0-9]+' | tail -n1 || echo 0)
          COUNT=${COUNT:-0}

          echo "Scraper found $COUNT new jobs"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -gt 0 ]; then
            echo "has_new=true"  >> "$GITHUB_OUTPUT"
          else
            echo "has_new=false" >> "$GITHUB_OUTPUT"
          fi

      # Notify when there are NO new jobs
      - name: Notify Teams (no new jobs)
        if: steps.scrape.outputs.has_new == 'false'
        env:
          FLOW_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}   # <-- this is your Power Automate URL
        run: |
          MSG="ℹ️ No new jobs found."
          curl -sS -X POST "$FLOW_URL" \
            -H "Content-Type: application/json" \
            -d "{\"message\":\"$MSG\"}"

      # Notify when there ARE new jobs
      - name: Notify Teams (new jobs)
        if: steps.scrape.outputs.has_new == 'true'
        env:
          FLOW_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          COUNT: ${{ steps.scrape.outputs.count }}
        run: |
          MSG="✅ ${COUNT} new job(s) found by Careers Monitor."
          curl -sS -X POST "$FLOW_URL" \
            -H "Content-Type: application/json" \
            -d "{\"message\":\"$MSG\"}"
