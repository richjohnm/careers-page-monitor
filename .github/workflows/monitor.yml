name: Careers Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'  # hourly at :17 UTC

permissions:
  contents: write   # allow push if your scraper commits state

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true   # keeps GITHUB_TOKEN for push

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile scraper/main.py

      # Run the scraper and capture output. Detect count from new_jobs.json.
      - name: Run scraper and capture output
        id: scrape
        shell: bash
        run: |
          set -euo pipefail
          python -m scraper.main | tee scraper_out.txt

          if [ -f new_jobs.json ]; then
            COUNT=$(python - <<'PY'
import json
with open("new_jobs.json","r",encoding="utf-8") as f:
    print(len(json.load(f)))
PY
)
            echo "Detected $COUNT new jobs from new_jobs.json"
            echo "has_new=true"  >> "$GITHUB_OUTPUT"
            echo "count=$COUNT"  >> "$GITHUB_OUTPUT"
          else
            echo "No new_jobs.json found; assuming 0 new jobs"
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            echo "count=0"       >> "$GITHUB_OUTPUT"
          fi

      # Always print a debug summary so we can see what's going on
      - name: Debug workspace (list files and preview job data)
        if: ${{ always() }}
        shell: bash
        run: |
          echo "PWD=$(pwd)"
          echo "Python:"; python -V
          echo
          echo "Top-level files:"; ls -la
          echo
          echo "scraper_out.txt (last 50 lines):"
          tail -n 50 scraper_out.txt || true
          echo
          echo "Check for new_jobs files:"
          ls -la new_jobs* || true
          echo
          echo "new_jobs.json preview:"
          python - <<'PY'
import json, os
p = "new_jobs.json"
print("exists:", os.path.exists(p))
if os.path.exists(p):
    try:
        data = json.load(open(p, "r", encoding="utf-8"))
        print("count:", len(data))
        for j in data[:5]:
            print({k: j.get(k) for k in ("title","company","url")})
    except Exception as e:
        print("Error reading JSON:", e)
PY

      # Upload the full job files as artifacts only when new jobs exist
      - name: Upload job list artifacts
        if: ${{ hashFiles('new_jobs.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: new-jobs-${{ github.run_id }}
          path: |
            new_jobs.json
            new_jobs.csv
            new_jobs.md
          retention-days: 7
