name: Careers Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'  # hourly at :17 UTC

permissions:
  contents: write   # <-- allow push

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true   # <-- keeps GITHUB_TOKEN for push

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile scraper/main.py

      - name: Send Teams ping (diagnostic)
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          payload=$(cat <<'JSON'
          {
            "@type": "MessageCard",
            "@context": "https://schema.org/extensions",
            "summary": "Ping",
            "themeColor": "0076D7",
            "title": "GitHub Actions Ping",
            "text": "✅ Careers Monitor workflow can reach Teams."
          }
          JSON
          )
          curl -sS -X POST -H "Content-Type: application/json" -d "$payload" "$TEAMS_WEBHOOK_URL" -o /dev/null -w "Teams HTTP status: %{http_code}\n"

      - name: Run scraper
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: python -m scraper.main
